# The Observatory's website: the pages in observatory/site and an index of every repository with the
# topic `observatory-agenda`, rebuilt hourly and deployed to this repository's GitHub Pages. It runs
# only once the repository variable OBSERVATORY_PAGES is `true` (after Pages is set to GitHub Actions).
name: site
on:
  push:
    branches: [main]
    paths: [observatory/**]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: vars.OBSERVATORY_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Index the agendas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp observatory/site/*.html observatory/site/*.css observatory/site/*.js _site/
          python3 observatory/site/build.py github _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
