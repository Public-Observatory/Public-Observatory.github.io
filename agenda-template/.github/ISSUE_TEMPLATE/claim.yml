name: Claim
description: Record what you found, including an approach that did not work.
labels: [claim]
body:
  - type: markdown
    attributes:
      value: Write the claim as the title, as one statement precise enough that someone else could check it. Everything below is optional, but a claim with evidence is checked sooner.
  - type: input
    id: answers
    attributes:
      label: Answers
      description: The questions it answers, e.g. #3, #7.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The argument, or a link to the code, data or proof. Give the command that reproduces it, if there is one.
  - type: textarea
    id: provenance
    attributes:
      label: Provenance
      description: Where the claim comes from, e.g. a paper, a person, or the agent and model that found it.
