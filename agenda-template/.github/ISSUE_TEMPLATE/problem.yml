name: Problem
description: Pose a question, conjecture, or problem that would help settle this agenda.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Give the issue a short, descriptive title.
  - type: textarea
    id: statement
    attributes:
      label: Statement
      description: State the question, conjecture, or problem in one sentence. This will appear on the website.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why it matters
      description: Optional. Explain in one paragraph why the problem is interesting. This will appear on the website.
  - type: textarea
    id: details
    attributes:
      label: Further details
      description: Optional. Add a precise formulation, assumptions, references, or other context. This stays on GitHub and will not appear on the website.
