name: Question
description: Ask something that would help settle this agenda.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Write the question as the title, precisely enough that one could tell when it has been answered. Everything below is optional.
  - type: input
    id: part-of
    attributes:
      label: Part of
      description: The larger question this one helps to settle, e.g. #12. Leave it empty if it bears on the agenda's root question.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Why it matters, what is known, and where the difficulty lies.
