# Every pull request: agenda.json is well formed, so that the Observatory can list the agenda.
name: check
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.OBSERVATORY_REPO || 'Public-Observatory/Public-Observatory.github.io' }}
          path: .observatory
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The agenda is well formed
        run: python3 .observatory/site/agenda.py check agenda.json
