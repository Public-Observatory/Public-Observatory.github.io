# Publishes the record to this repository's GitHub Pages site, where the Observatory reads it:
# snapshot.json (everything the website shows), report.md, and store/ (which `ev pull` reads).
# It runs hourly as well, since leases expire and the snapshot judges them at the time of building.
name: publish
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [record]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  PYTHONPATH: .engine
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.OBSERVATORY_ENGINE || 'Public-Observatory/observatory' }}
          path: .engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          SITE: ${{ vars.OBSERVATORY_SITE || 'https://public-observatory.github.io/observatory' }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site
          python3 -m evidence snapshot --json > _site/snapshot.json
          python3 -m evidence report > _site/report.md
          python3 -m evidence serve --export _site/store
          cp agenda.json _site/
          [ -f README.md ] && cp README.md _site/
          python3 .engine/contrib/agenda.py page agenda.json "$SITE" "$REPO" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
