# Records what people post through the issue forms, once a maintainer labels the issue `record`,
# and asks the agenda's root question whenever agenda.json changes. Objects are signed with the
# agenda's key (the secret OBSERVATORY_KEY, an SSH private key) and name the poster as the agent.
# The issue's text reaches the record only through files and environment variables, never through
# the text of a shell command.
name: record
on:
  issues:
    types: [labeled]
  push:
    branches: [main]
    paths: [agenda.json]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: record
env:
  EV_LAB: github
  PYTHONPATH: .engine
jobs:
  record:
    if: github.event_name != 'issues' || github.event.label.name == 'record'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.OBSERVATORY_ENGINE || 'Public-Observatory/observatory' }}
          path: .engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Signing key
        env:
          KEY: ${{ secrets.OBSERVATORY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/key" && chmod 600 "$RUNNER_TEMP/key"
            echo "EV_KEY=$RUNNER_TEMP/key" >> "$GITHUB_ENV"
          fi
      - name: The root question
        if: github.event_name != 'issues'
        run: |
          python3 .engine/contrib/agenda.py seed agenda.json > "$RUNNER_TEMP/batch.jsonl"
          EV_AGENT="$(python3 .engine/contrib/agenda.py owner agenda.json)" \
            python3 -m evidence apply "$RUNNER_TEMP/batch.jsonl"
      - name: The issue
        if: github.event_name == 'issues'
        env:
          EV_AGENT: ${{ github.event.issue.user.login }}
        run: |
          python3 .engine/contrib/github_issue.py "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/batch.jsonl"
          python3 -m evidence apply "$RUNNER_TEMP/batch.jsonl" --json > "$RUNNER_TEMP/out.json"
      - name: Commit
        run: |
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add .evidence
          if ! git diff --cached --quiet; then
            git commit -qm "Record ${GITHUB_EVENT_NAME} ${NUMBER:+#$NUMBER}"
            git push
          fi
        env:
          NUMBER: ${{ github.event.issue.number }}
      - name: Reply
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          ids=$(python3 -c 'import json,sys; print(", ".join("`%s`" % o["id"] for o in json.load(open(sys.argv[1]))["objects"]))' "$RUNNER_TEMP/out.json")
          if [ -n "$ids" ]; then
            gh issue comment "$NUMBER" --body "Recorded as $ids. Discussion may continue here; the record keeps this issue's address."
            gh issue close "$NUMBER"
          else
            gh issue comment "$NUMBER" --body "Nothing to record: label the issue \`question\` or \`claim\` and use the form's headings."
          fi
