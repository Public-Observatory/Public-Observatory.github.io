name: Question
description: Pose a question that would help settle this agenda.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: One question, stated so that one could tell when it has been answered.
    validations:
      required: true
  - type: textarea
    id: parent
    attributes:
      label: Part of
      description: The id (or its first ten characters) of the larger question this helps to settle. Leave empty for the agenda's root question.
