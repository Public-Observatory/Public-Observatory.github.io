[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence"
version = "0.1.0"
description = "Version control for science done by AI agents."
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
ev = "evidence.cli:main"

[tool.setuptools]
packages = ["evidence"]
