<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Public Observatory</title>
<meta name="description" content="Open research agendas, worked on in public by people and their agents.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.0/katex.min.css" integrity="sha512-ShgGHY1DxXgJ048WLBq4a1WB85Ppw9pb59F5waDdd/mAzSuKfCg4pzrsIECClh+1IhwY3ux6e4ZEbjw15y9kGQ==" crossorigin="anonymous">
<link rel="stylesheet" href="observatory.css">
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="./">The Public Observatory</a>
  <nav class="site"><a href="about.html">About</a><a href="https://github.com/Public-Observatory/agenda-template" id="new-agenda">Pose an agenda</a></nav>
</div></header>
<main class="wrap">
  <!-- Edit the page text in content/index.md. -->
  <div class="hero" id="page-content" aria-live="polite">
    <p><a href="content/index.md">Read the introduction</a>.</p>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search agendas" aria-label="Search agendas">
    <div class="chips" role="group" aria-label="Kind">
      <button class="chip" data-kind="" aria-pressed="true">All</button>
      <button class="chip" data-kind="open-agenda" aria-pressed="false">Open agendas</button>
      <button class="chip" data-kind="closed-agenda" aria-pressed="false">Closed agendas</button>
    </div>
    <select id="sort" aria-label="Sort">
      <option value="active">Recently active</option>
      <option value="open">Most open questions</option>
      <option value="new">Newest</option>
      <option value="progress">Furthest along</option>
    </select>
  </div>
  <div class="cards" id="cards"></div>
  <p class="empty" id="empty" hidden></p>
</main>
<footer class="site"><div class="wrap" id="built"><a href="https://github.com/Public-Observatory/Public-Observatory.github.io">Source</a>.</div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.0/katex.min.js" integrity="sha512-PMGpBvoAMUyHk238o5oDsOos5wAGWnc02JgF5lk5T5Nt2K4A2RHW0NyL1jd+IRSh0DmxcQNu0j/OhhrTDfaw0Q==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.0/contrib/auto-render.min.js" integrity="sha512-0HzJcHCD+wBh9kNUUcm3DWH9IbNDfudsYyMD5EHwSuFK6aEsaa/UEPqqk4t0pm4bbmwR6A11yNsD7Q+nz6XF+Q==" crossorigin="anonymous"></script>
<script src="marked.js"></script>
<script src="purify.js"></script>
<script src="observatory.js"></script>
<script>Observatory.page("content/index.md");
Observatory.index();</script>
</body>
</html>
